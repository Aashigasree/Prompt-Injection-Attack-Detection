<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prompt Injection Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f14;--surface:#16181f;--surface2:#1d2029;--surface3:#23263100;
  --border:#2a2d3a;--text-primary:#e8eaf0;--text-secondary:#7c8099;--text-muted:#4a4f66;
  --green:#06d6a0;--green-dim:rgba(6,214,160,0.12);--green-border:rgba(6,214,160,0.28);
  --red:#ff3d5a;--red-dim:rgba(255,61,90,0.12);--red-border:rgba(255,61,90,0.28);
  --blue:#4cc9f0;--purple:#9b72cf;--orange:#ff8c42;
  --font-mono:'JetBrains Mono',monospace;--font-sans:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);display:flex;flex-direction:column}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:13px 26px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:12px}
.header-brand{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;background:linear-gradient(135deg,var(--red),#8b001e);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 0 12px rgba(255,61,90,0.35)}
.brand-title{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.brand-sub{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}

/* stat cards in header */
.header-stats{display:flex;gap:8px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;text-align:center;min-width:90px;transition:border-color .2s}
.stat-card:hover{border-color:rgba(76,201,240,0.35)}
.stat-val{font-family:var(--font-mono);font-size:20px;font-weight:700;line-height:1}
.stat-lbl{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;font-family:var(--font-mono)}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-green{color:var(--green)} .c-orange{color:var(--orange)}

.live-pill{display:flex;align-items:center;gap:7px;background:rgba(6,214,160,.07);border:1px solid var(--green-border);border-radius:20px;padding:6px 14px;font-family:var(--font-mono);font-size:10px;color:var(--green);letter-spacing:.04em;white-space:nowrap}
.pulse{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* ── MAIN ── */
.main{display:grid;grid-template-columns:390px 1fr;flex:1;overflow:hidden}

/* ── LEFT PANEL ── */
.left-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.panel-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-hdr-title{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-secondary)}
.count-badge{font-family:var(--font-mono);font-size:10px;padding:2px 9px;border-radius:12px;background:rgba(76,201,240,.1);color:var(--blue);border:1px solid rgba(76,201,240,.25)}

.prompt-list{flex:1;overflow-y:auto;padding:6px 0}
.prompt-list::-webkit-scrollbar{width:3px}
.prompt-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.prompt-item{padding:10px 16px;border-bottom:1px solid rgba(42,45,58,.45);cursor:pointer;position:relative;transition:background .15s}
.prompt-item:hover{background:var(--surface2)}
.prompt-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;transition:opacity .2s}
.prompt-item.safe::before{background:var(--green)}
.prompt-item.attack::before{background:var(--red)}

.pi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.pi-preview{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-weight:500}
.status-tag{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.tag-safe{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.tag-attack{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}

.pi-meta{display:flex;align-items:center;justify-content:space-between}
.pi-method{font-size:9px;font-family:var(--font-mono);color:var(--text-muted)}
.pi-method span{color:var(--blue);font-weight:600}
.pi-time{font-size:9px;font-family:var(--font-mono);color:var(--text-muted)}

/* expanded full prompt */
.pi-full{display:none;margin-top:8px;padding:9px 10px;background:rgba(13,14,20,.6);border:1px solid var(--border);border-radius:5px;font-family:var(--font-mono);font-size:9px;color:var(--text-secondary);line-height:1.6;word-break:break-word;max-height:120px;overflow-y:auto}
.pi-full::-webkit-scrollbar{width:3px}
.pi-full::-webkit-scrollbar-thumb{background:var(--border)}
.prompt-item.expanded .pi-full{display:block}
.prompt-item.expanded .pi-preview{white-space:normal;overflow:visible;text-overflow:unset}

/* ── RIGHT PANEL ── */
.right-panel{display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);overflow:hidden}
.chart-cell{background:var(--surface);padding:16px 18px 12px;display:flex;flex-direction:column;overflow:hidden}
.chart-cell.span2{grid-column:1/3}
.chart-lbl{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.chart-dot{width:6px;height:6px;border-radius:50%}
.chart-wrap{flex:1;position:relative;min-height:0}
canvas{display:block}

/* fade-in animation for list items */
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="logo">🛡</div>
    <div>
      <div class="brand-title">Prompt Injection Monitor</div>
      <div class="brand-sub">Real-time detection &amp; analysis system</div>
    </div>
  </div>

  <div class="header-stats">
    <div class="stat-card">
      <div class="stat-val c-blue" id="s-total">0</div>
      <div class="stat-lbl">Total Prompts</div>
    </div>
    <div class="stat-card">
      <div class="stat-val c-red" id="s-attacks">0</div>
      <div class="stat-lbl">Total Attacks</div>
    </div>
    <div class="stat-card">
      <div class="stat-val c-green" id="s-safe">0</div>
      <div class="stat-lbl">Safe Prompts</div>
    </div>
    <div class="stat-card">
      <div class="stat-val c-orange" id="s-today">0</div>
      <div class="stat-lbl">Prompts Today</div>
    </div>
  </div>

  <div class="live-pill"><div class="pulse"></div>LIVE MONITORING</div>
</header>

<main class="main">

  <!-- LEFT: Recent Prompts -->
  <aside class="left-panel">
    <div class="panel-hdr">
      <span class="panel-hdr-title">// Recent Prompts</span>
      <span class="count-badge" id="prompt-count">0 entries</span>
    </div>
    <div class="prompt-list" id="prompt-list"></div>
  </aside>

  <!-- RIGHT: Charts -->
  <section class="right-panel">

    <!-- Attacks Per Day — full width top row -->
    <div class="chart-cell span2">
      <div class="chart-lbl">
        <span class="chart-dot" style="background:var(--blue)"></span>
        Attacks Per Day — Last 30 Days
      </div>
      <div class="chart-wrap"><canvas id="chartDaily"></canvas></div>
    </div>

    <!-- Detection Method -->
    <div class="chart-cell">
      <div class="chart-lbl">
        <span class="chart-dot" style="background:var(--purple)"></span>
        Detection Method Distribution
      </div>
      <div class="chart-wrap"><canvas id="chartMethod"></canvas></div>
    </div>

    <!-- Prompt Status -->
    <div class="chart-cell">
      <div class="chart-lbl">
        <span class="chart-dot" style="background:var(--green)"></span>
        Prompt Status Overview
      </div>
      <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
    </div>

  </section>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA — replace with real backend fetch when ready
   ═══════════════════════════════════════════════════════════ */
const prompts = [
{% for p in prompts %}
{
  prompt: "{{ p.prompt_text|escapejs }}",
  status: "{% if p.status == 'danger' %}attack{% else %}safe{% endif %}",
  method: "{{ p.detection_type|lower }}",
  timestamp: "{{ p.created_at|date:'Y-m-d H:i' }}"
},
{% endfor %}
];

/* 30-day attack counts — index 0 = 30 days ago, index 29 = today */
const dailyAttacks = [
  4,7,3,9,5,12,8,6,11,14,7,10,9,15,18,6,13,20,11,8,
  16,9,14,22,18,11,19,24,17,13
];

/* ═══════════════════════════════════════════════════════════
   COMPUTED STATS
   ═══════════════════════════════════════════════════════════ */
const totalAttacks  = prompts.filter(p => p.status === "attack").length;
const totalSafe     = prompts.filter(p => p.status === "safe").length;
const totalPrompts  = prompts.length;
const todayStr      = "2026-03-06";
const promptsToday  = prompts.filter(p => p.timestamp.startsWith(todayStr)).length;

const methodCounts  = { "rule-based": 0, "ml": 0, "combined": 0 };
prompts.filter(p => p.status === "attack").forEach(p => { methodCounts[p.method] = (methodCounts[p.method] || 0) + 1; });

/* ═══════════════════════════════════════════════════════════
   RENDER STAT CARDS
   ═══════════════════════════════════════════════════════════ */
function animCount(el, target) {
  let cur = 0;
  const step = Math.ceil(target / 30);
  const t = setInterval(() => {
    cur = Math.min(cur + step, target);
    el.textContent = cur;
    if (cur >= target) clearInterval(t);
  }, 30);
}
animCount(document.getElementById("s-total"),   totalPrompts);
animCount(document.getElementById("s-attacks"),  totalAttacks);
animCount(document.getElementById("s-safe"),     totalSafe);
animCount(document.getElementById("s-today"),    promptsToday);
document.getElementById("prompt-count").textContent = `${prompts.length} entries`;

/* ═══════════════════════════════════════════════════════════
   RENDER PROMPT LIST
   ═══════════════════════════════════════════════════════════ */
function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const methodLabel = { "rule-based": "Rule-Based", "ml": "ML-Based", "combined": "Combined" };

const list = document.getElementById("prompt-list");
prompts.forEach((p, i) => {
  const item = document.createElement("div");
  item.className = `prompt-item ${p.status}`;
  item.style.animation = `fadeIn 0.3s ease ${i * 0.035}s both`;
  item.innerHTML = `
    <div class="pi-top">
      <span class="pi-preview">${escHtml(p.prompt)}</span>
      <span class="status-tag tag-${p.status}">${p.status}</span>
    </div>
    <div class="pi-meta">
      <span class="pi-method">via <span>${methodLabel[p.method]}</span></span>
      <span class="pi-time">${p.timestamp}</span>
    </div>
    <div class="pi-full">${escHtml(p.prompt)}</div>`;

  item.addEventListener("click", () => {
    const wasExpanded = item.classList.contains("expanded");
    document.querySelectorAll(".prompt-item.expanded").forEach(el => el.classList.remove("expanded"));
    if (!wasExpanded) item.classList.add("expanded");
  });

  list.appendChild(item);
});

/* ═══════════════════════════════════════════════════════════
   CHART DEFAULTS
   ═══════════════════════════════════════════════════════════ */
Chart.defaults.color = "#4a4f66";
Chart.defaults.font.family = "'JetBrains Mono', monospace";
Chart.defaults.font.size = 10;
const gc = "rgba(42,45,58,0.75)";
const tooltipDefaults = {
  backgroundColor: "#1d2029",
  borderColor: "#2a2d3a",
  borderWidth: 1,
  titleColor: "#e8eaf0",
  bodyColor: "#7c8099",
  padding: 10,
  cornerRadius: 6,
};

/* ═══════════════════════════════════════════════════════════
   1. ATTACKS PER DAY — BAR CHART
   ═══════════════════════════════════════════════════════════ */
(function() {
  const today = new Date("2026-03-06");
  const labels = Array.from({ length: 30 }, (_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() - (29 - i));
    return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  });

  new Chart(document.getElementById("chartDaily"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Attacks",
        data: dailyAttacks,
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, ctx.chart.height);
          g.addColorStop(0,   "rgba(76,201,240,0.82)");
          g.addColorStop(0.7, "rgba(76,201,240,0.28)");
          g.addColorStop(1,   "rgba(76,201,240,0.04)");
          return g;
        },
        borderColor: "rgba(76,201,240,0.85)",
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 900, easing: "easeOutQuart" },
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltipDefaults, callbacks: { label: c => `  ${c.parsed.y} attacks` } }
      },
      scales: {
        x: { grid: { color: gc }, ticks: { color: "#4a4f66", maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
        y: { grid: { color: gc }, ticks: { color: "#4a4f66", precision: 0 }, beginAtZero: true }
      }
    }
  });
})();

/* ═══════════════════════════════════════════════════════════
   2. DETECTION METHOD DISTRIBUTION — DOUGHNUT
   ═══════════════════════════════════════════════════════════ */
new Chart(document.getElementById("chartMethod"), {
  type: "doughnut",
  data: {
    labels: ["Rule-Based", "ML-Based", "Combined"],
    datasets: [{
      data: [methodCounts["rule-based"], methodCounts["ml"], methodCounts["combined"]],
      backgroundColor: ["rgba(155,114,207,0.82)", "rgba(76,201,240,0.82)", "rgba(255,140,66,0.82)"],
      borderColor: "#16181f",
      borderWidth: 3,
      hoverOffset: 10,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    cutout: "60%",
    animation: { animateRotate: true, duration: 1000 },
    plugins: {
      legend: {
        display: true, position: "right",
        labels: { color: "#7c8099", font: { size: 10 }, padding: 14, boxWidth: 10, usePointStyle: true }
      },
      tooltip: { ...tooltipDefaults, callbacks: { label: c => {
        const t = c.dataset.data.reduce((a,b)=>a+b,0);
        return `  ${c.parsed} attacks  (${((c.parsed/t)*100).toFixed(1)}%)`;
      }}}
    }
  }
});

/* ═══════════════════════════════════════════════════════════
   3. PROMPT STATUS OVERVIEW — PIE CHART
   ═══════════════════════════════════════════════════════════ */
new Chart(document.getElementById("chartStatus"), {
  type: "pie",
  data: {
    labels: ["Safe Prompts", "Attacks"],
    datasets: [{
      data: [totalSafe, totalAttacks],
      backgroundColor: ["rgba(6,214,160,0.82)", "rgba(255,61,90,0.82)"],
      borderColor: "#16181f",
      borderWidth: 3,
      hoverOffset: 10,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    animation: { animateRotate: true, duration: 1100 },
    plugins: {
      legend: {
        display: true, position: "right",
        labels: { color: "#7c8099", font: { size: 10 }, padding: 14, boxWidth: 10, usePointStyle: true }
      },
      tooltip: { ...tooltipDefaults, callbacks: { label: c => {
        const t = c.dataset.data.reduce((a,b)=>a+b,0);
        return `  ${c.parsed} prompts  (${((c.parsed/t)*100).toFixed(1)}%)`;
      }}}
    }
  }
});
</script>
</body>
</html>
